<!-- Generic AI model icon — Feather-style outline -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
     fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!-- chip body -->
  <rect x="3" y="5" width="18" height="14" rx="2" />
  <!-- top pins -->
  <line x1="8" y1="5" x2="8" y2="2" />
  <line x1="12" y1="5" x2="12" y2="2" />
  <line x1="16" y1="5" x2="16" y2="2" />
  <!-- bottom pins -->
  <line x1="8" y1="19" x2="8" y2="22" />
  <line x1="16" y1="19" x2="16" y2="22" />
  <!-- center AI dot -->
  <circle cx="12" cy="12" r="2.5" fill="#64748b" stroke="none" />
</svg>
