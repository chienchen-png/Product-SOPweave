name: Windows verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sopweave
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
          cache: pip
          cache-dependency-path: sopweave/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sopweave/frontend/package-lock.json
      - name: Install locked Python dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Check Python dependencies
        run: python -m pip check
      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend
      - name: Frontend build
        run: npm run build --prefix frontend
      - name: Native launcher build
        run: powershell -NoProfile -File scripts/build_launcher.ps1
      - name: Backend regressions
        run: python -m unittest discover -s tests -t . -v
      - name: Frontend regressions
        run: npm test --prefix frontend
      - name: Runtime check
        run: python scripts/check_runtime.py
      - name: Production dependency audit
        run: npm audit --omit=dev --prefix frontend
